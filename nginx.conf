server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /api/17track/ {
        proxy_pass https://api.17track.net/;
        proxy_set_header Host api.17track.net;
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
    }

    location /api/nominatim/ {
        proxy_pass https://nominatim.openstreetmap.org/;
        proxy_set_header User-Agent "TrackPkgVisualizer/1.0 (package-tracking-app)";
        proxy_ssl_server_name on;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
